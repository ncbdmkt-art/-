<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌增長決策儀錶板｜資料上傳中心 </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
    /* =========================================================
       1. 建立「色票變數中心」：未來要改品牌顏色，只要改這裡就好！
       ========================================================= */
    :root {
        /* 🟩 主品牌色系 (綠色) */
        --primary: #7cb342;          /* 主按鈕、主要強調色 */
        --primary-dark: #5a7452;     /* 次要文字、說明標籤 */
        --primary-text: #2c5e2a;     /* 導覽列連結、次要按鈕文字 */
        
        /* ⬜ 背景色系 */
        --bg-main: #eef5ea;          /* 網頁最底層大背景 */
        --bg-card: #ffffff;          /* 白色卡片背景 */
        --bg-card-inner: #f9fbf5;    /* 卡片內的淺色區塊 (如檔案列表) */
        --bg-hover: #fafdf5;         /* 滑鼠移過去的背景色 */
        --btn-sec-bg: #e4ecd9;       /* 次要按鈕背景色 */
        
        /* 📏 邊框與文字色系 */
        --text-main: #2c3e2f;        /* 網頁主要文字顏色 */
        --border-light: #c5e0b4;     /* 虛線邊框色 */
        --border-muted: #e2e8e0;     /* 分隔線色 */
        --hr-color: #dcecd0;         /* 底部大分隔線色 */

        /* 🔴🟢 系統狀態色 (成功、錯誤、警告) */
        --status-error: #d9534f;
        --status-success: #5cb85c;
        --status-info: #5bc0de;
        --status-warn-bg: #fef7e0;
        --status-warn-border: #f0ad4e;
    }

    /* =========================================================
       2. 以下是你原本的排版，只是把顏色換成 var(--變數) 呼叫
       ========================================================= */
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
        background: var(--bg-main); /* 使用變數 */
        font-family: 'Inter', sans-serif; 
        padding: 40px 20px; 
        color: var(--text-main);    /* 使用變數 */
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    
    .sub { margin-bottom: 40px; color: var(--primary-dark); }
    
    .upload-grid { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 48px; }
    .upload-card { flex: 1; min-width: 280px; background: var(--bg-card); border-radius: 32px; padding: 24px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); }
    .upload-card h2 { font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .upload-area { border: 2px dashed var(--border-light); border-radius: 24px; padding: 32px 20px; text-align: center; margin: 16px 0; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { background: var(--bg-hover); border-color: var(--primary); }
    .upload-area i { color: var(--primary) !important; } /* 確保 icon 吃主色 */
    
    .file-list { margin-top: 16px; font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: var(--bg-card-inner); border-radius: 20px; padding: 12px; }
    .file-item { padding: 4px 0; border-bottom: 1px solid var(--border-muted); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 8px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s; }
    .btn:hover { filter: brightness(0.95); } /* 偷偷幫你加了懸停變暗的小細節 */
    
    .btn-secondary { background: var(--btn-sec-bg); color: var(--primary-text); margin-top: 8px; }
    
    .nav-links { margin-top: 40px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .nav-links a { background: var(--bg-card); padding: 12px 24px; border-radius: 40px; text-decoration: none; color: var(--primary-text); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: 0.2s; }
    .nav-links a:hover { background: var(--primary); color: white; }
    
    hr { margin: 24px 0; border-color: var(--hr-color); }
    
    .status { margin-top: 12px; font-size: 0.8rem; max-height: 150px; overflow-y: auto; }
    .error { color: var(--status-error); }
    .success { color: var(--status-success); }
    .info { color: var(--status-info); }
    
    .small-note { font-size: 0.75rem; color: var(--primary-dark); margin-top: 8px; }
    
    .debug-tip { background: var(--status-warn-bg); border-left: 4px solid var(--status-warn-border); padding: 8px 12px; margin-top: 12px; font-size: 0.7rem; border-radius: 12px; }
</style>
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-line"></i> 品牌增長決策儀錶板</h1>
    <div class="sub">請分別上傳「社群後臺檔案」與「客群回饋表單」，系統將依檔名自動分類</div>

    <div class="upload-grid">
        <div class="upload-card">
            <h2><i class="fab fa-facebook"></i> 社群後臺檔案</h2>
            <p class="small-note">支援 CSV，檔名需包含 <strong>IG / FB / LINE / YouTube / Threads</strong> 關鍵字（不區分大小寫）。<br>
            ✅ 日期欄位支援「2025/08/ 05」、「2025/08/05」等帶有空格的格式。</p>
            <div id="socialUploadArea" class="upload-area">
                <i class="fas fa-cloud-upload-alt fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 (可多選)</p>
                <input type="file" id="socialFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="socialFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearSocialBtn" class="btn btn-secondary">清空所有社群資料</button>
            <div id="socialStatus" class="status"></div>
        </div>

        <div class="upload-card">
            <h2><i class="fas fa-users"></i> 客群回饋表單</h2>
            <p class="small-note">檔名需包含 <strong>回饋表單</strong> 或 <strong>feedback</strong> 關鍵字（不區分大小寫）。</p>
            <div id="feedbackUploadArea" class="upload-area">
                <i class="fas fa-file-csv fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 CSV (可多選)</p>
                <input type="file" id="feedbackFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="feedbackFileList" class="file-list">尚未上傳任何回饋表單</div>
            <button id="clearFeedbackBtn" class="btn btn-secondary">清空回饋數據</button>
            <div id="feedbackStatus" class="status"></div>
        </div>
    </div>

    <hr>
    <div class="nav-links">
        <a href="dashboard.html">📊 策略監測室</a>
        <a href="check.html">✅ 發佈達標沒</a>
        <a href="audience.html">👥 客群分析後臺</a>
        <a href="funnel.html">📈 活動轉換漏斗</a>
    </div>
</div>

<script>
    // ======================== 🔧 強化版日期解析（核心修復） ========================
    /**
     * 解析日期，支援下列格式：
     * - 標準日期字串 (new Date 可解析)
     * - 含中間空格的日期如 "2025/08/ 05" 、 "2025/08 /05" 、 "2025/ 08/05"
     * - 全形空格或各式空白
     * - Excel 序列號 (數字)
     * - 中文年月日格式 (2024年12月1日)
     */
    function parseDate(value) {
        if (!value) return null;
        
        // 1️⃣ 轉為字串，並移除「所有空白字元」(包含空格、全型空白、tab、換行等)
        let cleaned = String(value).replace(/\s+/g, '');
        if (cleaned === '') return null;
        
        // 2️⃣ 嘗試標準 Date 建構 (大部分瀏覽器對 yyyy/mm/dd 支援良好)
        let d = new Date(cleaned);
        if (!isNaN(d.getTime())) return d;
        
        // 3️⃣ 匹配 yyyy/mm/dd 或 yyyy-mm-dd (移除空白後的正則)
        let match = cleaned.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (match) {
            let year = match[1];
            let month = match[2].padStart(2, '0');
            let day = match[3].padStart(2, '0');
            let isoStr = `${year}-${month}-${day}`;
            let parsed = new Date(isoStr);
            if (!isNaN(parsed.getTime())) return parsed;
        }
        
        // 4️⃣ 處理中文格式：2024年12月1日 或 2024/12月1日 等 (先移除空白再匹配)
        let chineseMatch = cleaned.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
        if (chineseMatch) {
            let year = chineseMatch[1];
            let month = chineseMatch[2].padStart(2, '0');
            let day = chineseMatch[3].padStart(2, '0');
            let parsed = new Date(`${year}-${month}-${day}`);
            if (!isNaN(parsed.getTime())) return parsed;
        }
        
        // 5️⃣ 嘗試 Excel 序列號 (數字)
        if (!isNaN(Number(cleaned))) {
            let excelDate = new Date((Number(cleaned) - 25569) * 86400000);
            if (!isNaN(excelDate.getTime())) return excelDate;
        }
        
        // 6️⃣ 最後一搏：嘗試用原始值 (未去除空白前) 進行 Date 解析，但通常已處理過
        let lastTry = new Date(value);
        if (!isNaN(lastTry.getTime())) return lastTry;
        
        return null;
    }

    // ------------------------ 欄位映射與正規化 (增加除錯能力) ------------------------
    function normalizeRowKeys(row) {
        const normalized = {};
        for (let [key, val] of Object.entries(row)) {
            if (val === undefined || val === null) continue;
            let cleanKey = String(key).trim().toLowerCase();
            // 移除全形/半形括號影響
            cleanKey = cleanKey.replace(/[（(]/g, '(').replace(/[）)]/g, ')');
            normalized[cleanKey] = val;
        }
        return normalized;
    }

    function mapPostFromRow(row, fallbackChannel) {
        const normalized = normalizeRowKeys(row);
        
        // 優先抓取日期欄位 : 發佈日期 / date / 貼文日期
        let dateValue = normalized['發佈日期'] || normalized['date'] || normalized['貼文日期'] || null;
        let date = dateValue ? parseDate(dateValue) : null;
        
        // 若日期無效，詳細記錄（方便使用者偵錯）
        if (!date) {
            console.warn(`⚠️ 日期解析失敗，原始值: "${dateValue}"，清理後字串: "${dateValue ? String(dateValue).replace(/\s+/g, '') : 'null'}"`);
            return null;
        }
        
        // 平台判讀：優先使用「發布管道」欄位，若無則使用 fallbackChannel (來自檔名)
        let platform = normalized['發布管道'] || normalized['platform'] || '';
        if (!platform && fallbackChannel) platform = fallbackChannel;
        if (!platform) {
            console.warn(`⚠️ 缺少平台資訊，日期: ${date.toISOString()}, 可用的欄位: ${Object.keys(normalized).slice(0,5).join(',')}`);
            return null;
        }
        
        // 數值欄位 (處理空字串或非數字)
        const toNumber = (val) => {
            if (val === undefined || val === null) return 0;
            let num = Number(val);
            return isNaN(num) ? 0 : num;
        };
        
        let views = toNumber(normalized['觀看數'] ?? normalized['母串觀看數'] ?? normalized['views'] ?? 0);
        let likes = toNumber(normalized['點讚數'] ?? normalized['likes'] ?? 0);
        let shares = toNumber(normalized['分享數'] ?? normalized['repost/點擊連結'] ?? normalized['reposts'] ?? normalized['shares'] ?? 0);
        let saves = toNumber(normalized['儲存數'] ?? normalized['saves'] ?? 0);
        let interactions = toNumber(normalized['互動數'] ?? normalized['interactions'] ?? 0);
        let nonFansPercent = toNumber(normalized['非粉絲比例'] ?? normalized['nonfanspercent'] ?? 0);
        
        // IP 標籤偵測
        let hasIP = (normalized['標籤'] && /ip/i.test(normalized['標籤'])) || 
                    (normalized['活動主題'] && /ip/i.test(normalized['活動主題']));
        
        return {
            date, 
            platform: String(platform), 
            type: String(normalized['專案類型'] || normalized['format'] || ''),
            title: String(normalized['串文名稱'] || normalized['活動主題'] || '無標題'),
            views, likes, shares, saves, interactions, nonFansPercent, hasIP, 
            retentionRate: 0, 
            raw: row
        };
    }

    function parseCSVtoPosts(jsonRows, channel) {
        const posts = [];
        let invalidCount = 0;
        for (let i = 0; i < jsonRows.length; i++) {
            const post = mapPostFromRow(jsonRows[i], channel);
            if (post) {
                posts.push(post);
            } else {
                invalidCount++;
                if (invalidCount <= 3) {
                    console.warn(`第 ${i+1} 列無效 (日期或平台缺失):`, jsonRows[i]);
                }
            }
        }
        if (posts.length === 0 && jsonRows.length > 0) {
            console.error(`❌ 頻道 ${channel} 所有 ${jsonRows.length} 列皆無法解析。請檢查CSV必備欄位: 「發佈日期」與「發布管道」(或透過檔名自動判斷平台)`);
        }
        return posts;
    }

    function readCSVFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    // 對每個物件的字串值進行前置 trim (避免欄位值前後空白影響判定，但主要日期修復在 parseDate)
                    const cleanedJson = json.map(row => {
                        const newRow = {};
                        for (let [k, v] of Object.entries(row)) {
                            if (typeof v === 'string') {
                                newRow[k] = v.trim();
                            } else {
                                newRow[k] = v;
                            }
                        }
                        return newRow;
                    });
                    resolve(cleanedJson);
                } catch (err) { reject(err); }
            };
            reader.onerror = err => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    // ======================== 配置驅動的上傳區塊 ========================
    const sections = [
        {
            type: 'social',
            fileInputId: 'socialFiles',
            uploadAreaId: 'socialUploadArea',
            fileListId: 'socialFileList',
            statusId: 'socialStatus',
            clearBtnId: 'clearSocialBtn',
            isValidFile: (filename) => {
                const upper = filename.toUpperCase();
                return upper.includes('IG') || upper.includes('FB') || upper.includes('LINE') ||
                       upper.includes('YOUTUBE') || upper.includes('THREADS');
            },
            getChannel: (filename) => {
                const upper = filename.toUpperCase();
                if (upper.includes('IG')) return 'IG';
                if (upper.includes('FB')) return 'FB';
                if (upper.includes('LINE')) return 'LINE';
                if (upper.includes('YOUTUBE')) return 'YouTube';
                if (upper.includes('THREADS')) return 'Threads';
                return null;
            },
            processFiles: async (files, statusDiv, updateDisplayFn) => {
                let hasError = false;
                for (let file of files) {
                    const channel = sections[0].getChannel(file.name);
                    if (!channel) {
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含 IG/FB/LINE/YouTube/Threads 關鍵字，已略過。</div>`;
                        hasError = true;
                        continue;
                    }
                    try {
                        const jsonRows = await readCSVFile(file);
                        if (!jsonRows.length) throw new Error('CSV 無資料列');
                        console.log(`📄 解析檔案: ${file.name}，欄位樣本:`, Object.keys(jsonRows[0] || {}).slice(0,6));
                        const posts = parseCSVtoPosts(jsonRows, channel);
                        if (posts.length === 0) {
                            const sampleRow = jsonRows[0] || {};
                            const hasDateCol = sampleRow['發佈日期'] || sampleRow['date'] || sampleRow['貼文日期'];
                            const hasPlatformCol = sampleRow['發布管道'] || sampleRow['platform'];
                            let reason = '';
                            if (!hasDateCol) reason = '缺少「發佈日期」或「date」欄位；';
                            if (!hasPlatformCol && !channel) reason += '缺少「發布管道」欄位且檔名無法判別平台；';
                            if (!hasDateCol && !hasPlatformCol) reason = '欄位不符合預期格式 (需包含發佈日期, 發布管道)。';
                            throw new Error(`無法解析出有效貼文。 ${reason} 請檢查CSV欄位名稱。`);
                        }
                        const key = `posts_${channel}`;
                        let existing = JSON.parse(localStorage.getItem(key) || '[]');
                        existing = existing.concat(posts);
                        localStorage.setItem(key, JSON.stringify(existing));
                        statusDiv.innerHTML += `<div class="success">✅ ${file.name} → ${channel} (成功匯入 ${posts.length} 筆貼文)</div>`;
                    } catch (err) {
                        console.error(`處理檔案 ${file.name} 錯誤:`, err);
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
                        hasError = true;
                    }
                }
                if (updateDisplayFn) updateDisplayFn();
                return !hasError;
            },
            updateDisplay: () => {
                const channels = ['IG', 'FB', 'LINE', 'YouTube', 'Threads'];
                let html = '', hasAny = false;
                channels.forEach(ch => {
                    const raw = localStorage.getItem(`posts_${ch}`);
                    if (raw) {
                        try {
                            const count = JSON.parse(raw).length;
                            html += `<div class="file-item">📁 ${ch} : ${count} 筆貼文</div>`;
                            hasAny = true;
                        } catch(e) {}
                    }
                });
                document.getElementById('socialFileList').innerHTML = hasAny ? html : '尚未上傳任何社群檔案';
            },
            clearData: () => {
                ['IG', 'FB', 'LINE', 'YouTube', 'Threads'].forEach(ch => localStorage.removeItem(`posts_${ch}`));
                sections[0].updateDisplay();
                const statusDiv = document.getElementById('socialStatus');
                statusDiv.innerHTML = '<div class="success">🗑️ 已清空所有社群資料</div>';
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        },
        {
            type: 'feedback',
            fileInputId: 'feedbackFiles',
            uploadAreaId: 'feedbackUploadArea',
            fileListId: 'feedbackFileList',
            statusId: 'feedbackStatus',
            clearBtnId: 'clearFeedbackBtn',
            isValidFile: (filename) => /回饋表單/i.test(filename) || /feedback/i.test(filename),
            getChannel: null,
            processFiles: async (files, statusDiv, updateDisplayFn) => {
                for (let file of files) {
                    if (!sections[1].isValidFile(file.name)) {
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含「回饋表單」或「feedback」，已略過。</div>`;
                        continue;
                    }
                    try {
                        const rows = await readCSVFile(file);
                        if (!rows.length) throw new Error('CSV 無資料列');
                        let existing = JSON.parse(localStorage.getItem('feedbackData') || '[]');
                        existing = existing.concat(rows);
                        localStorage.setItem('feedbackData', JSON.stringify(existing));
                        statusDiv.innerHTML += `<div class="success">✅ ${file.name} (匯入 ${rows.length} 筆回饋)</div>`;
                    } catch (err) {
                        console.error(err);
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
                    }
                }
                if (updateDisplayFn) updateDisplayFn();
            },
            updateDisplay: () => {
                const raw = localStorage.getItem('feedbackData');
                let count = 0;
                if (raw) {
                    try { count = JSON.parse(raw).length; } catch(e) {}
                }
                document.getElementById('feedbackFileList').innerHTML = count ? `📋 已上傳 ${count} 筆回饋記錄` : '尚未上傳任何回饋表單';
            },
            clearData: () => {
                localStorage.removeItem('feedbackData');
                sections[1].updateDisplay();
                const statusDiv = document.getElementById('feedbackStatus');
                statusDiv.innerHTML = '<div class="success">🗑️ 已清空回饋數據</div>';
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        }
    ];

    // 初始化上傳功能 (綁定事件、拖曳等)
    sections.forEach((section, idx) => {
        const fileInput = document.getElementById(section.fileInputId);
        const uploadArea = document.getElementById(section.uploadAreaId);
        const statusDiv = document.getElementById(section.statusId);
        const clearBtn = document.getElementById(section.clearBtnId);
        
        // 為了避免閉包問題，建立一個更新顯示的函數
        const refreshDisplay = () => section.updateDisplay();
        
        // 封裝處理函數，自動更新顯示
        const handleFiles = (files) => {
            if (!files.length) return;
            section.processFiles(files, statusDiv, refreshDisplay);
            // 8秒後清除狀態訊息 (但不清除錯誤提示也可以保留一段時間)
            setTimeout(() => {
                if (statusDiv.innerHTML.includes('✅') || statusDiv.innerHTML.includes('❌')) {
                    // 保留最後一條紀錄不清除過快，但保留重要訊息，只清除部分提示？為了UX不清除也可。
                }
            }, 10000);
        };
        
        // 點擊上傳區
        uploadArea.addEventListener('click', () => fileInput.click());
        // 檔案選取變更
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
            // 重置 input value 以允許重複上傳相同檔案
            fileInput.value = '';
        });
        
        // 清除按鈕
        clearBtn.addEventListener('click', () => {
            section.clearData();
            refreshDisplay();
        });
        
        // 拖曳上傳
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.background = '#f4fae9'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.background = ''; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });
        
        // 初始顯示
        section.updateDisplay();
    });
    
    // 額外：在控制台輸出提醒，方便檢查日期解析邏輯
    console.log("✅ 頁面已啟動 — 日期解析已強化，支援移除中間空格(ex: '2025/08/ 05' 正確解析)");
    
    // 提供一個簡單的測試方法 (開發者可於控制台呼叫 window.testDateParser)
    window.testDateParser = () => {
        const testCases = [
            "2025/08/ 05",
            " 2025/08/05 ",
            "2025/08 /05",
            "2025/ 08/05",
            "2025年08月05日",
            "2025-08-05",
            "08/05/2025"
        ];
        console.group("🧪 日期解析測試 (修復後)");
        testCases.forEach(tc => {
            const result = parseDate(tc);
            console.log(`原始: "${tc}" → ${result ? result.toLocaleDateString() : '❌ 解析失敗'} (${result})`);
        });
        console.groupEnd();
    };
</script>
