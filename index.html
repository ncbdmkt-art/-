<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌增長決策儀錶板｜資料上傳中心 </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
    /* =========================================================
       1. 建立「色票變數中心」：未來要改品牌顏色，只要改這裡就好！
       ========================================================= */
    :root {
        /* 🟩 主品牌色系 (綠色) */
        --primary: #7cb342;          /* 主按鈕、主要強調色 */
        --primary-dark: #5a7452;     /* 次要文字、說明標籤 */
        --primary-text: #2c5e2a;     /* 導覽列連結、次要按鈕文字 */
        
        /* ⬜ 背景色系 */
        --bg-main: #eef5ea;          /* 網頁最底層大背景 */
        --bg-card: #ffffff;          /* 白色卡片背景 */
        --bg-card-inner: #f9fbf5;    /* 卡片內的淺色區塊 (如檔案列表) */
        --bg-hover: #fafdf5;         /* 滑鼠移過去的背景色 */
        --btn-sec-bg: #e4ecd9;       /* 次要按鈕背景色 */
        
        /* 📏 邊框與文字色系 */
        --text-main: #2c3e2f;        /* 網頁主要文字顏色 */
        --border-light: #c5e0b4;     /* 虛線邊框色 */
        --border-muted: #e2e8e0;     /* 分隔線色 */
        --hr-color: #dcecd0;         /* 底部大分隔線色 */

        /* 🔴🟢 系統狀態色 (成功、錯誤、警告) */
        --status-error: #d9534f;
        --status-success: #5cb85c;
        --status-info: #5bc0de;
        --status-warn-bg: #fef7e0;
        --status-warn-border: #f0ad4e;
    }

    /* =========================================================
       2. 以下是你原本的排版，只是把顏色換成 var(--變數) 呼叫
       ========================================================= */
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
        background: var(--bg-main); /* 使用變數 */
        font-family: 'Inter', sans-serif; 
        padding: 40px 20px; 
        color: var(--text-main);    /* 使用變數 */
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    
    .sub { margin-bottom: 40px; color: var(--primary-dark); }
    
    .upload-grid { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 48px; }
    .upload-card { flex: 1; min-width: 280px; background: var(--bg-card); border-radius: 32px; padding: 24px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); }
    .upload-card h2 { font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .upload-area { border: 2px dashed var(--border-light); border-radius: 24px; padding: 32px 20px; text-align: center; margin: 16px 0; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { background: var(--bg-hover); border-color: var(--primary); }
    .upload-area i { color: var(--primary) !important; } /* 確保 icon 吃主色 */
    
    .file-list { margin-top: 16px; font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: var(--bg-card-inner); border-radius: 20px; padding: 12px; }
    .file-item { padding: 4px 0; border-bottom: 1px solid var(--border-muted); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 8px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s; }
    .btn:hover { filter: brightness(0.95); } /* 偷偷幫你加了懸停變暗的小細節 */
    
    .btn-secondary { background: var(--btn-sec-bg); color: var(--primary-text); margin-top: 8px; }
    
    .nav-links { margin-top: 40px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .nav-links a { background: var(--bg-card); padding: 12px 24px; border-radius: 40px; text-decoration: none; color: var(--primary-text); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: 0.2s; }
    .nav-links a:hover { background: var(--primary); color: white; }
    
    hr { margin: 24px 0; border-color: var(--hr-color); }
    
    .status { margin-top: 12px; font-size: 0.8rem; max-height: 150px; overflow-y: auto; }
    .error { color: var(--status-error); }
    .success { color: var(--status-success); }
    .info { color: var(--status-info); }
    
    .small-note { font-size: 0.75rem; color: var(--primary-dark); margin-top: 8px; }
    
    .debug-tip { background: var(--status-warn-bg); border-left: 4px solid var(--status-warn-border); padding: 8px 12px; margin-top: 12px; font-size: 0.7rem; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-line"></i> 品牌增長決策儀錶板</h1>
    <div class="sub">請分別上傳「社群後臺檔案」與「客群回饋表單」，系統將依檔名自動分類</div>

    <div class="upload-grid">
        <div class="upload-card">
            <h2><i class="fab fa-facebook"></i> 社群後臺檔案</h2>
            <p class="small-note">支援 CSV，檔名需包含 <strong>IG / FB / LINE / YouTube / Threads</strong> 關鍵字（不區分大小寫）。</p>
            <div id="socialUploadArea" class="upload-area">
                <i class="fas fa-cloud-upload-alt fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 (可多選)</p>
                <input type="file" id="socialFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="socialFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearSocialBtn" class="btn btn-secondary">清空所有社群資料</button>
            <div id="socialStatus" class="status"></div>
        </div>

        <div class="upload-card">
            <h2><i class="fas fa-users"></i> 客群回饋表單</h2>
            <p class="small-note">檔名需包含 <strong>回饋表單</strong> 或 <strong>feedback</strong> 關鍵字（不區分大小寫）。</p>
            <div id="feedbackUploadArea" class="upload-area">
                <i class="fas fa-file-csv fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 CSV (可多選)</p>
                <input type="file" id="feedbackFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="feedbackFileList" class="file-list">尚未上傳任何回饋表單</div>
            <button id="clearFeedbackBtn" class="btn btn-secondary">清空回饋數據</button>
            <div id="feedbackStatus" class="status"></div>
        </div>
    </div>

    <hr>
    <div class="nav-links">
        <a href="dashboard.html">📊 策略監測室</a>
        <a href="check.html">✅ 發佈達標沒</a>
        <a href="audience.html">👥 客群分析後臺</a>
        <a href="funnel.html">📈 活動轉換漏斗</a>
    </div>
</div>

<script>
    // ======================== 🛡️ UI 安全小幫手 ========================
    // 汰換危險的 innerHTML +=，改用原生的 textContent 來防止 XSS 攻擊
    function appendStatusMessage(container, message, type = 'success') {
        const msgDiv = document.createElement('div');
        msgDiv.className = type; 
        msgDiv.textContent = message; 
        container.appendChild(msgDiv);
    }

    // ======================== 🔧 強化版日期解析（核心修復） ========================
    function parseDate(value) {
        if (!value) return null;
        let str = String(value).trim().replace(/\s+/g, '');
        
        // ==========================================
        // 🛡️ 1. Excel 序列號終極破解 (支援 46141, 46141.5, 46141-01)
        // ==========================================
        // 使用正則表達式，只要開頭是 5 位數字 (現代 Excel 日期)，就強制攔截，不管尾巴帶什麼符號
        const excelMatch = str.match(/^(\d{5})(?:[\-\.]\d+)?$/);
        if (excelMatch) {
            const days = parseInt(excelMatch[1], 10);
            // Excel 的基準日換算成 JavaScript 的基準日，需扣除 25569 天，再乘以每天的毫秒數 (86400000)
            return new Date((days - 25569) * 86400000);
        }

        // ==========================================
        // 🛡️ 2. 處理標準斜線或破折號 (YYYY/MM/DD 或 YYYY-MM-DD)
        // ==========================================
        const parts = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (parts) {
            const y = parseInt(parts[1], 10);
            const m = parseInt(parts[2], 10) - 1; // JS 的月份是 0~11
            const d = parseInt(parts[3], 10);
            return new Date(y, m, d);
        }

        // ==========================================
        // 🛡️ 3. 處理純中文格式 (YYYY年MM月DD日)
        // ==========================================
        const zhParts = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
        if (zhParts) {
            const y = parseInt(zhParts[1], 10);
            const m = parseInt(zhParts[2], 10) - 1;
            const d = parseInt(zhParts[3], 10);
            return new Date(y, m, d);
        }

        // ==========================================
        // 🛡️ 4. 原生兜底解析 (最後的安全網)
        // ==========================================
        const d = new Date(str);
        if (!isNaN(d.getTime())) return d;

        return null;
    }
    // ======================== 🗄️ 資料連接總管 (Data Manager) ========================
    // 將所有跟 localStorage 溝通的邏輯集中在這裡，未來若要換成 API 或雲端資料庫，只要改這裡就好！
    const DataManager = {
        // --- 社群資料管理 ---
        saveSocialPosts: function(channel, newPosts) {
            const key = `posts_${channel}`;
            let existing = this.getSocialPosts(channel);
            existing = existing.concat(newPosts);
            localStorage.setItem(key, JSON.stringify(existing));
        },
        getSocialPosts: function(channel) {
            const raw = localStorage.getItem(`posts_${channel}`);
            return raw ? JSON.parse(raw) : [];
        },
        clearAllSocialPosts: function() {
            ['IG', 'FB', 'LINE', 'YouTube', 'Threads'].forEach(ch => localStorage.removeItem(`posts_${ch}`));
        },

        // --- 回饋表單資料管理 ---
        saveFeedback: function(newRows) {
            let existing = this.getFeedback();
            existing = existing.concat(newRows);
            localStorage.setItem('feedbackData', JSON.stringify(existing));
        },
        getFeedback: function() {
            const raw = localStorage.getItem('feedbackData');
            return raw ? JSON.parse(raw) : [];
        },
        clearFeedback: function() {
            localStorage.removeItem('feedbackData');
        }
    };

    // ------------------------ 欄位映射與正規化 (增加除錯能力) ------------------------
    function normalizeRowKeys(row) {
        const normalized = {};
        for (let [key, val] of Object.entries(row)) {
            if (val === undefined || val === null) continue;
            let cleanKey = String(key).trim().toLowerCase();
            cleanKey = cleanKey.replace(/[（(]/g, '(').replace(/[）)]/g, ')');
            normalized[cleanKey] = val;
        }
        return normalized;
    }

function mapPostFromRow(row, fallbackChannel) {
        const normalized = normalizeRowKeys(row);
        
        let rawDateValue = normalized['發佈日期'] || normalized['date'] || normalized['貼文日期'] || null;
        if (rawDateValue && typeof rawDateValue === 'string') {
            rawDateValue = rawDateValue.replace(/[^\d\/\-\s]/g, ''); 
        }
        let date = rawDateValue ? parseDate(rawDateValue) : null;
        if (!date) return null;
        
        let platform = normalized['發布管道'] || normalized['platform'] || '';
        if (!platform && fallbackChannel) platform = fallbackChannel;
        if (!platform) return null;
        
        const toNumber = (val) => {
            if (val === undefined || val === null || val === '') return 0;
            let strVal = String(val).trim();
            if (strVal === '-' || strVal === 'N/A') return 0;
            strVal = strVal.replace(/,/g, '');
            if (strVal.includes('%')) strVal = strVal.replace(/%/g, '');
            let num = parseFloat(strVal);
            return isNaN(num) ? 0 : num;
        };

        const extractMetric = (rowObj, keywordArray) => {
            const keys = Object.keys(rowObj);
            for (let keyword of keywordArray) {
                const matchedKey = keys.find(k => k.includes(keyword.toLowerCase()));
                if (matchedKey && rowObj[matchedKey] !== undefined && rowObj[matchedKey] !== '') {
                    return toNumber(rowObj[matchedKey]);
                }
            }
            return 0; 
        };

        const extractString = (rowObj, keywordArray) => {
            const keys = Object.keys(rowObj);
            for (let keyword of keywordArray) {
                const matchedKey = keys.find(k => k.includes(keyword.toLowerCase()));
                if (matchedKey && rowObj[matchedKey]) {
                    return String(rowObj[matchedKey]).trim();
                }
            }
            return ''; 
        };

        // ==========================================
        // 1. 觸及與觀看 (嚴格拆分)
        // ==========================================
        let reach = extractMetric(normalized, ['觸及帳號', '觸及人數', 'reach', '觸及']);
        let views = extractMetric(normalized, ['母串觀看', '觀看次數', '觀看', 'views', '瀏覽']);
        
        // ==========================================
        // 2. 基礎互動指標提取
        // ==========================================
        let likes = extractMetric(normalized, ['點讚', '喜歡', '讚', 'likes']);
        let shares = extractMetric(normalized, ['repost', '引用', '轉發', '分享', '點擊連結', 'shares']);
        let comments = extractMetric(normalized, ['留言', '回覆', 'comments']); 
        let interactions = extractMetric(normalized, ['互動數', '互動', 'interactions']);
        
        let followers = extractMetric(normalized, ['粉絲數', '追蹤人數', '訂閱', 'followers']);
        let nonFansPercent = extractMetric(normalized, ['非粉絲比例', '非粉絲', 'nonfans']);
        let engagementRate = extractMetric(normalized, ['互動率', 'engagement rate']);

        // ==========================================
        // 3. YouTube 專屬運算邏輯攔截器
        // ==========================================
        if (platform === 'YouTube') {
            // YT 自動加總：點讚 + 留言 + 分享
            interactions = likes + comments + shares;
            
            // YT 互動率：互動數 / 訂閱者數 * 100%
            if (followers > 0) {
                engagementRate = parseFloat(((interactions / followers) * 100).toFixed(2));
            }
        }

        // ==========================================
        // 4. 文字與類別處理 (標籤+專案類型 = 主題類別)
        // ==========================================
        let title = extractString(normalized, ['串文名稱', '活動主題', 'title']) || '無標題';
        let format = extractString(normalized, ['格式', 'format']);
        
        // 提取標籤與專案類型，並合併 (如果都有則用 ' - ' 連接，如果都沒有就回傳 '無')
        let rawTag = extractString(normalized, ['標籤', 'tags']);
        let rawProjectType = extractString(normalized, ['專案類型', 'project type']);
        let themeCategory = [rawTag, rawProjectType].filter(Boolean).join(' - ') || '無主題類別';

        // IP 標籤偵測 (僅適用 IG/FB/YT，專案包含"推廣行銷"且格式包含"影片")
        let hasIP = false;
        if (['IG', 'FB', 'YouTube'].includes(platform)) {
            if (rawProjectType.includes('推廣行銷') && format.includes('影片')) {
                hasIP = true;
            }
        }

        // ==========================================
        // 5. 輸出標準化物件 (包含 AdvancedMetrics)
        // ==========================================
        return {
            date, 
            platform: String(platform), 
            themeCategory,  // ✅ 新增：合併後的主題類別
            format,         // ✅ 新增：格式
            title,
            reach,          // ✅ 拆分：觸及數
            views,          // ✅ 拆分：觀看數
            likes, 
            shares, 
            comments,       // 新增：留言數
            interactions,   // ✅ YT已自動加總
            engagementRate, // ✅ YT已依訂閱數計算
            followers,      
            nonFansPercent, 
            hasIP,          // ✅ 已更新判定邏輯
            
            // 📦 進階特定數據獨立存放區
            advancedMetrics: {
                ytAvgViewDurationPercent: extractMetric(normalized, ['平均觀看時間比例']),
                ytRetentionPercent: extractMetric(normalized, ['續看觀眾比率', '續看']),
                ytUniqueViewers90d: extractMetric(normalized, ['非重複觀眾人數']),
                igRetentionRate: extractMetric(normalized, ['留存率'])
            },
            
            raw: row
        };
    }

    function parseCSVtoPosts(jsonRows, channel) {
        const posts = [];
        let invalidCount = 0;
        for (let i = 0; i < jsonRows.length; i++) {
            const post = mapPostFromRow(jsonRows[i], channel);
            if (post) {
                posts.push(post);
            } else {
                invalidCount++;
                if (invalidCount <= 3) {
                    console.warn(`第 ${i+1} 列無效 (日期或平台缺失):`, jsonRows[i]);
                }
            }
        }
        if (posts.length === 0 && jsonRows.length > 0) {
            console.error(`❌ 頻道 ${channel} 所有 ${jsonRows.length} 列皆無法解析。請檢查CSV必備欄位: 「發佈日期」與「發布管道」(或透過檔名自動判斷平台)`);
        }
        return posts;
    }

    function readCSVFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    const cleanedJson = json.map(row => {
                        const newRow = {};
                        for (let [k, v] of Object.entries(row)) {
                            if (typeof v === 'string') {
                                newRow[k] = v.trim();
                            } else {
                                newRow[k] = v;
                            }
                        }
                        return newRow;
                    });
                    resolve(cleanedJson);
                } catch (err) { reject(err); }
            };
            reader.onerror = err => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    // ======================== 配置驅動的上傳區塊 ========================
    const sections = [
        {
            type: 'social',
            fileInputId: 'socialFiles',
            uploadAreaId: 'socialUploadArea',
            fileListId: 'socialFileList',
            statusId: 'socialStatus',
            clearBtnId: 'clearSocialBtn',
            isValidFile: (filename) => {
                const upper = filename.toUpperCase();
                return upper.includes('IG') || upper.includes('FB') || upper.includes('LINE') ||
                       upper.includes('YOUTUBE') || upper.includes('THREADS');
            },
            getChannel: (filename) => {
                const upper = filename.toUpperCase();
                if (upper.includes('IG')) return 'IG';
                if (upper.includes('FB')) return 'FB';
                if (upper.includes('LINE')) return 'LINE';
                if (upper.includes('YOUTUBE')) return 'YouTube';
                if (upper.includes('THREADS')) return 'Threads';
                return null;
            },
            processFiles: async (files, statusDiv, updateDisplayFn) => {
                let hasError = false;
                for (let file of files) {
                    const channel = sections[0].getChannel(file.name);
                    if (!channel) {
                        appendStatusMessage(statusDiv, `❌ ${file.name} : 檔名未包含 IG/FB/LINE/YouTube/Threads 關鍵字，已略過。`, 'error');
                        hasError = true;
                        continue;
                    }
                    try {
                        const jsonRows = await readCSVFile(file);
                        if (!jsonRows.length) throw new Error('CSV 無資料列');
                        console.log(`📄 解析檔案: ${file.name}，欄位樣本:`, Object.keys(jsonRows[0] || {}).slice(0,6));
                        const posts = parseCSVtoPosts(jsonRows, channel);
                        if (posts.length === 0) {
                            throw new Error(`無法解析出有效貼文。請檢查CSV欄位名稱。`);
                        }
                        DataManager.saveSocialPosts(channel, posts);
                        
                        appendStatusMessage(statusDiv, `✅ ${file.name} → ${channel} (成功匯入 ${posts.length} 筆貼文)`, 'success');
                    } catch (err) {
                        console.error(`處理檔案 ${file.name} 錯誤:`, err);
                        appendStatusMessage(statusDiv, `❌ ${file.name} 解析失敗: ${err.message}`, 'error');
                        hasError = true;
                    }
                }
                if (updateDisplayFn) updateDisplayFn();
                return !hasError;
            },
            updateDisplay: () => {
                const channels = ['IG', 'FB', 'LINE', 'YouTube', 'Threads'];
                let html = '', hasAny = false;
                channels.forEach(ch => {
                    const posts = DataManager.getSocialPosts(ch);
                    if (posts && posts.length > 0) {
                        html += `<div class="file-item">📁 ${ch} : ${posts.length} 筆貼文</div>`;
                        hasAny = true;
                    }
                });
                document.getElementById('socialFileList').innerHTML = hasAny ? html : '尚未上傳任何社群檔案';
            },
            clearData: () => {
                DataManager.clearAllSocialPosts();
                sections[0].updateDisplay();
                const statusDiv = document.getElementById('socialStatus');
                statusDiv.innerHTML = '';
                appendStatusMessage(statusDiv, '🗑️ 已清空所有社群資料', 'success');
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        },
        {
            type: 'feedback',
            fileInputId: 'feedbackFiles',
            uploadAreaId: 'feedbackUploadArea',
            fileListId: 'feedbackFileList',
            statusId: 'feedbackStatus',
            clearBtnId: 'clearFeedbackBtn',
            isValidFile: (filename) => /回饋表單/i.test(filename) || /feedback/i.test(filename),
            getChannel: null,
            processFiles: async (files, statusDiv, updateDisplayFn) => {
                for (let file of files) {
                    if (!sections[1].isValidFile(file.name)) {
                        appendStatusMessage(statusDiv, `❌ ${file.name} : 檔名未包含「回饋表單」或「feedback」，已略過。`, 'error');
                        continue;
                    }
                    try {
                        const rows = await readCSVFile(file);
                        if (!rows.length) throw new Error('CSV 無資料列');
                        DataManager.saveFeedback(rows);
                        
                        appendStatusMessage(statusDiv, `✅ ${file.name} (匯入 ${rows.length} 筆回饋)`, 'success');
                    } catch (err) {
                        console.error(err);
                        appendStatusMessage(statusDiv, `❌ ${file.name} 解析失敗: ${err.message}`, 'error');
                    }
                }
                if (updateDisplayFn) updateDisplayFn();
            },
            updateDisplay: () => {
                const feedbackData = DataManager.getFeedback();
                const count = feedbackData ? feedbackData.length : 0;
                document.getElementById('feedbackFileList').innerHTML = count ? `📋 已上傳 ${count} 筆回饋記錄` : '尚未上傳任何回饋表單';
            },
            clearData: () => {
                DataManager.clearFeedback();
                sections[1].updateDisplay();
                const statusDiv = document.getElementById('feedbackStatus');
                statusDiv.innerHTML = '';
                appendStatusMessage(statusDiv, '🗑️ 已清空回饋數據', 'success');
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        }
    ];

    // 初始化上傳功能 (綁定事件、拖曳等)
    sections.forEach((section, idx) => {
        const fileInput = document.getElementById(section.fileInputId);
        const uploadArea = document.getElementById(section.uploadAreaId);
        const statusDiv = document.getElementById(section.statusId);
        const clearBtn = document.getElementById(section.clearBtnId);
        
        const refreshDisplay = () => section.updateDisplay();
        
        const handleFiles = (files) => {
            if (!files.length) return;
            section.processFiles(files, statusDiv, refreshDisplay);
        };
        
        // 點擊上傳區
        uploadArea.addEventListener('click', () => fileInput.click());
        // 檔案選取變更
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
            fileInput.value = '';
        });
        
        // 清除按鈕
        clearBtn.addEventListener('click', () => {
            section.clearData();
            refreshDisplay();
        });
        
        // 拖曳上傳
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.background = '#f4fae9'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.background = ''; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });
        
        // 初始顯示
        section.updateDisplay();
    });
    
    console.log("✅ 頁面已啟動 — 日期解析已強化，資安防護已啟動");
</script>
</body>
</html>
