<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌增長決策儀錶板｜資料上傳中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#eef5ea; font-family:'Inter',sans-serif; padding:40px 20px; color:#2c3e2f; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { font-size:2rem; margin-bottom:8px; }
        .sub { margin-bottom:40px; color:#5a7452; }
        .upload-grid { display:flex; flex-wrap:wrap; gap:32px; margin-bottom:48px; }
        .upload-card { flex:1; min-width:280px; background:white; border-radius:32px; padding:24px; box-shadow:0 6px 14px rgba(0,0,0,0.05); }
        .upload-card h2 { font-size:1.4rem; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .upload-area { border:2px dashed #c5e0b4; border-radius:24px; padding:32px 20px; text-align:center; margin:16px 0; cursor:pointer; transition:0.2s; }
        .upload-area:hover { background:#fafdf5; border-color:#7cb342; }
        .file-list { margin-top:16px; font-size:0.8rem; max-height:200px; overflow-y:auto; background:#f9fbf5; border-radius:20px; padding:12px; }
        .file-item { padding:4px 0; border-bottom:1px solid #e2e8e0; }
        .btn { background:#7cb342; color:white; border:none; padding:8px 24px; border-radius:40px; font-weight:600; cursor:pointer; margin-top:16px; width:100%; }
        .btn-secondary { background:#e4ecd9; color:#2c5e2a; margin-top:8px; }
        .nav-links { margin-top:40px; display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
        .nav-links a { background:white; padding:12px 24px; border-radius:40px; text-decoration:none; color:#2c5e2a; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        .nav-links a:hover { background:#7cb342; color:white; }
        hr { margin:24px 0; border-color:#dcecd0; }
        .status { margin-top:12px; font-size:0.8rem; max-height:150px; overflow-y:auto; }
        .error { color:#d9534f; }
        .success { color:#5cb85c; }
        .info { color:#5bc0de; }
        .small-note { font-size:0.75rem; color:#5a7452; margin-top:8px; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-line"></i> 品牌增長決策儀錶板</h1>
    <div class="sub">請分別上傳「社群後臺檔案」與「客群回饋表單」，系統將依檔名自動分類</div>

    <div class="upload-grid">
        <div class="upload-card">
            <h2><i class="fab fa-facebook"></i> 社群後臺檔案</h2>
            <p class="small-note">支援 CSV，檔名需包含 <strong>IG / FB / LINE / YouTube / Threads</strong> 關鍵字（不區分大小寫）。</p>
            <div id="socialUploadArea" class="upload-area">
                <i class="fas fa-cloud-upload-alt fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 (可多選)</p>
                <input type="file" id="socialFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="socialFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearSocialBtn" class="btn btn-secondary">清空所有社群資料</button>
            <div id="socialStatus" class="status"></div>
        </div>

        <div class="upload-card">
            <h2><i class="fas fa-users"></i> 客群回饋表單</h2>
            <p class="small-note">檔名需包含 <strong>回饋表單</strong> 或 <strong>feedback</strong> 關鍵字（不區分大小寫）。</p>
            <div id="feedbackUploadArea" class="upload-area">
                <i class="fas fa-file-csv fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 CSV (可多選)</p>
                <input type="file" id="feedbackFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="feedbackFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearFeedbackBtn" class="btn btn-secondary">清空回饋數據</button>
            <div id="feedbackStatus" class="status"></div>
        </div>
    </div>

    <hr>
    <div class="nav-links">
        <a href="dashboard.html">📊 決策儀錶板</a>
        <a href="check.html">✅ 發佈達標沒</a>
        <a href="audience.html">👥 客群分析後臺</a>
        <a href="funnel.html">📈 活動轉換漏斗</a>
    </div>
</div>

<script>
    // ---------- 輔助函數 ----------
    function getChannelFromFilename(filename) {
        const upper = filename.toUpperCase();
        if (upper.includes('IG')) return 'IG';
        if (upper.includes('FB')) return 'FB';
        if (upper.includes('LINE')) return 'LINE';
        if (upper.includes('YOUTUBE')) return 'YouTube';
        if (upper.includes('THREADS')) return 'Threads';
        return null;
    }

    function isFeedbackFile(filename) {
        return /回饋表單/i.test(filename) || /feedback/i.test(filename);
    }

    // 增強版日期解析
    function parseDate(value) {
        if (!value) return null;
        // 嘗試直接 new Date
        let d = new Date(value);
        if (!isNaN(d.getTime())) return d;
        // 嘗試常見格式: YYYY/MM/DD, YYYY-MM-DD, YYYY年M月D日
        let str = String(value).trim();
        let match = str.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
        if (match) {
            let year = match[1], month = match[2], day = match[3];
            d = new Date(`${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`);
            if (!isNaN(d.getTime())) return d;
        }
        // 嘗試 Excel 序列號 (較少見)
        if (!isNaN(Number(value))) {
            let excelDate = new Date((Number(value) - 25569) * 86400000);
            if (!isNaN(excelDate.getTime())) return excelDate;
        }
        return null;
    }

    // 智能映射單一貼文
    function mapPostFromRow(row, fallbackChannel = null) {
        // 將所有 key 標準化：去除前後空格、全形轉半形、轉小寫
        const normalized = {};
        for (let [key, val] of Object.entries(row)) {
            if (val === undefined || val === null) continue;
            let cleanKey = String(key).trim().toLowerCase();
            // 將全形括號、空格等轉為半形 (簡單處理)
            cleanKey = cleanKey.replace(/[（(]/g, '(').replace(/[）)]/g, ')');
            normalized[cleanKey] = val;
        }

        // 1. 日期：優先使用「發佈日期」
        let date = null;
        if (normalized['發佈日期']) date = parseDate(normalized['發佈日期']);
        else if (normalized['date']) date = parseDate(normalized['date']);
        if (!date) {
            console.warn('跳過：無效日期', normalized);
            return null;
        }

        // 2. 平臺：發布管道 / platform，若無則使用檔名推斷的管道
        let platform = normalized['發布管道'] || normalized['platform'] || '';
        if (!platform && fallbackChannel) platform = fallbackChannel;
        if (!platform) {
            console.warn('跳過：無平臺資訊', normalized);
            return null;
        }

        // 3. 觀看數 (支援多種別名)
        let views = normalized['觀看數'] ?? normalized['母串觀看數'] ?? normalized['views'];
        views = Number(views);
        if (isNaN(views)) views = 0;

        // 4. 點讚數
        let likes = normalized['點讚數'] ?? normalized['likes'];
        likes = Number(likes);
        if (isNaN(likes)) likes = 0;

        // 5. 分享數 / Repost / Reposts / 轉發
        let shares = normalized['分享數'] ?? normalized['repost/點擊連結'] ?? normalized['reposts'] ?? normalized['shares'];
        shares = Number(shares);
        if (isNaN(shares)) shares = 0;

        // 6. 儲存數
        let saves = normalized['儲存數'] ?? normalized['saves'];
        saves = Number(saves);
        if (isNaN(saves)) saves = 0;

        // 7. 互動數
        let interactions = normalized['互動數'] ?? normalized['interactions'];
        interactions = Number(interactions);
        if (isNaN(interactions)) interactions = 0;

        // 8. 非粉絲比例
        let nonFansPercent = normalized['非粉絲比例'] ?? normalized['nonfanspercent'];
        nonFansPercent = Number(nonFansPercent);
        if (isNaN(nonFansPercent)) nonFansPercent = 0;

        // 9. hasIP 判斷
        let hasIP = false;
        if (normalized['標籤'] && /ip/i.test(normalized['標籤'])) hasIP = true;
        if (normalized['活動主題'] && /ip/i.test(normalized['活動主題'])) hasIP = true;

        const type = normalized['專案類型'] || normalized['format'] || '';
        const title = normalized['串文名稱'] || normalized['活動主題'] || '';

        return {
            date,
            platform: String(platform),
            type: String(type),
            title: String(title),
            views,
            likes,
            shares,
            saves,
            interactions,
            nonFansPercent,
            hasIP,
            retentionRate: 0,
            raw: row
        };
    }

    function parseCSVtoPosts(jsonRows, channel) {
        const posts = [];
        for (let i = 0; i < jsonRows.length; i++) {
            const row = jsonRows[i];
            const post = mapPostFromRow(row, channel);
            if (post) {
                posts.push(post);
            } else {
                // 輸出前 3 筆無效資料的欄位樣貌，協助除錯
                if (i < 3) console.warn(`第 ${i+1} 列無效，原始欄位:`, Object.keys(row).slice(0,5).map(k=>`${k}=${row[k]}`).join(', '));
            }
        }
        return posts;
    }

    // ---------- 儲存與顯示函數 ----------
    function saveSocialPosts(channel, posts) {
        const key = `posts_${channel}`;
        let existing = [];
        const rawExisting = localStorage.getItem(key);
        if (rawExisting) {
            try {
                existing = JSON.parse(rawExisting);
            } catch (e) {
                console.error('解析既有資料失敗，重新初始化', e);
                existing = [];
            }
        }
        existing = existing.concat(posts);
        localStorage.setItem(key, JSON.stringify(existing));
        updateSocialFileList();
    }

    function saveFeedbackData(rows) {
        let existing = [];
        const rawExisting = localStorage.getItem('feedbackData');
        if (rawExisting) {
            try {
                existing = JSON.parse(rawExisting);
            } catch (e) {
                console.error('解析既有回饋資料失敗', e);
                existing = [];
            }
        }
        existing = existing.concat(rows);
        localStorage.setItem('feedbackData', JSON.stringify(existing));
        updateFeedbackFileList();
    }

    function updateSocialFileList() {
        const channels = ['IG', 'FB', 'LINE', 'YouTube', 'Threads'];
        let html = '';
        let hasAny = false;
        for (let ch of channels) {
            const raw = localStorage.getItem(`posts_${ch}`);
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    const count = data.length;
                    html += `<div class="file-item">📁 ${ch} : ${count} 筆貼文</div>`;
                    hasAny = true;
                } catch (e) {}
            }
        }
        if (!hasAny) html = '尚未上傳任何社群檔案';
        document.getElementById('socialFileList').innerHTML = html;
    }

    function updateFeedbackFileList() {
        const raw = localStorage.getItem('feedbackData');
        let count = 0;
        if (raw) {
            try {
                const data = JSON.parse(raw);
                count = data.length;
            } catch (e) {}
        }
        document.getElementById('feedbackFileList').innerHTML = count ? `📋 已上傳 ${count} 筆回饋記錄` : '尚未上傳任何回饋表單';
    }

    function readCSVFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    resolve(rows);
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    async function handleSocialFiles(files) {
        const statusDiv = document.getElementById('socialStatus');
        for (let file of files) {
            const channel = getChannelFromFilename(file.name);
            if (!channel) {
                statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含 IG/FB/LINE/YouTube/Threads 關鍵字，已略過。</div>`;
                continue;
            }
            try {
                const jsonRows = await readCSVFile(file);
                if (!jsonRows.length) throw new Error('CSV 無資料列');
                // 輸出欄位名稱到控制台，便於除錯
                console.log(`📄 檔案 ${file.name} 欄位名稱:`, Object.keys(jsonRows[0]));
                const posts = parseCSVtoPosts(jsonRows, channel);
                if (posts.length === 0) {
                    // 提供更詳細的錯誤訊息
                    const sampleRow = jsonRows[0];
                    const hasDate = sampleRow['發佈日期'] || sampleRow['date'];
                    const hasPlatform = sampleRow['發布管道'] || sampleRow['platform'];
                    let reason = '';
                    if (!hasDate) reason += '缺少「發佈日期」或「date」欄位；';
                    if (!hasPlatform) reason += '缺少「發布管道」或「platform」欄位；';
                    if (reason === '') reason = '日期或平臺格式無法正確解析，請檢查 CSV 內容。';
                    throw new Error(`無法從 CSV 解析出任何有效貼文。${reason} 詳情請看瀏覽器控制台。`);
                }
                saveSocialPosts(channel, posts);
                statusDiv.innerHTML += `<div class="success">✅ ${file.name} → ${channel} (成功解析 ${posts.length} 筆)</div>`;
            } catch (err) {
                console.error(err);
                statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
            }
        }
        setTimeout(() => { statusDiv.innerHTML = ''; }, 8000);
    }

    async function handleFeedbackFiles(files) {
        const statusDiv = document.getElementById('feedbackStatus');
        for (let file of files) {
            if (!isFeedbackFile(file.name)) {
                statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含「回饋表單」或「feedback」，已略過。</div>`;
                continue;
            }
            try {
                const rows = await readCSVFile(file);
                if (!rows.length) throw new Error('CSV 無資料列');
                saveFeedbackData(rows);
                statusDiv.innerHTML += `<div class="success">✅ ${file.name} (${rows.length} 筆)</div>`;
            } catch (err) {
                console.error(err);
                statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
            }
        }
        setTimeout(() => { statusDiv.innerHTML = ''; }, 8000);
    }

    function clearSocialData() {
        const channels = ['IG', 'FB', 'LINE', 'YouTube', 'Threads'];
        channels.forEach(ch => localStorage.removeItem(`posts_${ch}`));
        updateSocialFileList();
        const statusDiv = document.getElementById('socialStatus');
        statusDiv.innerHTML = '<div class="success">🗑️ 已清空所有社群資料</div>';
        setTimeout(() => statusDiv.innerHTML = '', 2000);
    }

    function clearFeedbackData() {
        localStorage.removeItem('feedbackData');
        updateFeedbackFileList();
        const statusDiv = document.getElementById('feedbackStatus');
        statusDiv.innerHTML = '<div class="success">🗑️ 已清空回饋數據</div>';
        setTimeout(() => statusDiv.innerHTML = '', 2000);
    }

    // 綁定事件
    document.getElementById('socialUploadArea').addEventListener('click', () => document.getElementById('socialFiles').click());
    document.getElementById('socialFiles').addEventListener('change', (e) => handleSocialFiles(Array.from(e.target.files)));
    document.getElementById('feedbackUploadArea').addEventListener('click', () => document.getElementById('feedbackFiles').click());
    document.getElementById('feedbackFiles').addEventListener('change', (e) => handleFeedbackFiles(Array.from(e.target.files)));
    document.getElementById('clearSocialBtn').addEventListener('click', clearSocialData);
    document.getElementById('clearFeedbackBtn').addEventListener('click', clearFeedbackData);

    function setupDragAndDrop(areaId, fileInputId, handler) {
        const area = document.getElementById(areaId);
        area.addEventListener('dragover', (e) => { e.preventDefault(); area.style.background = '#f4fae9'; });
        area.addEventListener('dragleave', () => { area.style.background = ''; });
        area.addEventListener('drop', (e) => {
            e.preventDefault();
            area.style.background = '';
            const files = Array.from(e.dataTransfer.files);
            handler(files);
            document.getElementById(fileInputId).files = files;
        });
    }
    setupDragAndDrop('socialUploadArea', 'socialFiles', handleSocialFiles);
    setupDragAndDrop('feedbackUploadArea', 'feedbackFiles', handleFeedbackFiles);

    updateSocialFileList();
    updateFeedbackFileList();
</script>
</body>
</html>
