<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌增長決策儀錶板｜資料上傳中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#eef5ea; font-family:'Inter',sans-serif; padding:40px 20px; color:#2c3e2f; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { font-size:2rem; margin-bottom:8px; }
        .sub { margin-bottom:40px; color:#5a7452; }
        .upload-grid { display:flex; flex-wrap:wrap; gap:32px; margin-bottom:48px; }
        .upload-card { flex:1; min-width:280px; background:white; border-radius:32px; padding:24px; box-shadow:0 6px 14px rgba(0,0,0,0.05); }
        .upload-card h2 { font-size:1.4rem; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .upload-area { border:2px dashed #c5e0b4; border-radius:24px; padding:32px 20px; text-align:center; margin:16px 0; cursor:pointer; transition:0.2s; }
        .upload-area:hover { background:#fafdf5; border-color:#7cb342; }
        .file-list { margin-top:16px; font-size:0.8rem; max-height:200px; overflow-y:auto; background:#f9fbf5; border-radius:20px; padding:12px; }
        .file-item { padding:4px 0; border-bottom:1px solid #e2e8e0; }
        .btn { background:#7cb342; color:white; border:none; padding:8px 24px; border-radius:40px; font-weight:600; cursor:pointer; margin-top:16px; width:100%; }
        .btn-secondary { background:#e4ecd9; color:#2c5e2a; margin-top:8px; }
        .nav-links { margin-top:40px; display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
        .nav-links a { background:white; padding:12px 24px; border-radius:40px; text-decoration:none; color:#2c5e2a; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        .nav-links a:hover { background:#7cb342; color:white; }
        hr { margin:24px 0; border-color:#dcecd0; }
        .status { margin-top:12px; font-size:0.8rem; max-height:150px; overflow-y:auto; }
        .error { color:#d9534f; }
        .success { color:#5cb85c; }
        .info { color:#5bc0de; }
        .small-note { font-size:0.75rem; color:#5a7452; margin-top:8px; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-line"></i> 品牌增長決策儀錶板</h1>
    <div class="sub">請分別上傳「社群後臺檔案」與「客群回饋表單」，系統將依檔名自動分類</div>

    <div class="upload-grid">
        <div class="upload-card">
            <h2><i class="fab fa-facebook"></i> 社群後臺檔案</h2>
            <p class="small-note">支援 CSV，檔名需包含 <strong>IG / FB / LINE / YouTube / Threads</strong> 關鍵字（不區分大小寫）。</p>
            <div id="socialUploadArea" class="upload-area">
                <i class="fas fa-cloud-upload-alt fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 (可多選)</p>
                <input type="file" id="socialFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="socialFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearSocialBtn" class="btn btn-secondary">清空所有社群資料</button>
            <div id="socialStatus" class="status"></div>
        </div>

        <div class="upload-card">
            <h2><i class="fas fa-users"></i> 客群回饋表單</h2>
            <p class="small-note">檔名需包含 <strong>回饋表單</strong> 或 <strong>feedback</strong> 關鍵字（不區分大小寫）。</p>
            <div id="feedbackUploadArea" class="upload-area">
                <i class="fas fa-file-csv fa-2x" style="color:#7cb342;"></i>
                <p>點擊或拖曳上傳 CSV (可多選)</p>
                <input type="file" id="feedbackFiles" accept=".csv,.CSV" multiple style="display:none;">
            </div>
            <div id="feedbackFileList" class="file-list">尚未上傳任何檔案</div>
            <button id="clearFeedbackBtn" class="btn btn-secondary">清空回饋數據</button>
            <div id="feedbackStatus" class="status"></div>
        </div>
    </div>

    <hr>
    <div class="nav-links">
        <a href="dashboard.html">📊 決策儀錶板</a>
        <a href="check.html">✅ 發佈達標沒</a>
        <a href="audience.html">👥 客群分析後臺</a>
        <a href="funnel.html">📈 活動轉換漏斗</a>
    </div>
</div>

<script>
    // ======================== 共用工具函數 ========================
    function parseDate(value) {
        if (!value) return null;
        let d = new Date(value);
        if (!isNaN(d.getTime())) return d;
        let str = String(value).trim();
        let match = str.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
        if (match) {
            let year = match[1], month = match[2], day = match[3];
            d = new Date(`${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`);
            if (!isNaN(d.getTime())) return d;
        }
        if (!isNaN(Number(value))) {
            let excelDate = new Date((Number(value) - 25569) * 86400000);
            if (!isNaN(excelDate.getTime())) return excelDate;
        }
        return null;
    }

    function mapPostFromRow(row, fallbackChannel) {
        const normalized = {};
        for (let [key, val] of Object.entries(row)) {
            if (val === undefined || val === null) continue;
            let cleanKey = String(key).trim().toLowerCase();
            cleanKey = cleanKey.replace(/[（(]/g, '(').replace(/[）)]/g, ')');
            normalized[cleanKey] = val;
        }

        let date = normalized['發佈日期'] ? parseDate(normalized['發佈日期']) : (normalized['date'] ? parseDate(normalized['date']) : null);
        if (!date) return null;

        let platform = normalized['發布管道'] || normalized['platform'] || '';
        if (!platform && fallbackChannel) platform = fallbackChannel;
        if (!platform) return null;

        let views = Number(normalized['觀看數'] ?? normalized['母串觀看數'] ?? normalized['views'] ?? 0);
        let likes = Number(normalized['點讚數'] ?? normalized['likes'] ?? 0);
        let shares = Number(normalized['分享數'] ?? normalized['repost/點擊連結'] ?? normalized['reposts'] ?? normalized['shares'] ?? 0);
        let saves = Number(normalized['儲存數'] ?? normalized['saves'] ?? 0);
        let interactions = Number(normalized['互動數'] ?? normalized['interactions'] ?? 0);
        let nonFansPercent = Number(normalized['非粉絲比例'] ?? normalized['nonfanspercent'] ?? 0);
        let hasIP = (normalized['標籤'] && /ip/i.test(normalized['標籤'])) || (normalized['活動主題'] && /ip/i.test(normalized['活動主題']));

        return {
            date, platform: String(platform), type: String(normalized['專案類型'] || normalized['format'] || ''),
            title: String(normalized['串文名稱'] || normalized['活動主題'] || ''),
            views, likes, shares, saves, interactions, nonFansPercent, hasIP, retentionRate: 0, raw: row
        };
    }

    function parseCSVtoPosts(jsonRows, channel) {
        const posts = [];
        for (let i = 0; i < jsonRows.length; i++) {
            const post = mapPostFromRow(jsonRows[i], channel);
            if (post) posts.push(post);
            else if (i < 3) console.warn(`第 ${i+1} 列無效，欄位:`, Object.keys(jsonRows[i]).slice(0,5).join(', '));
        }
        return posts;
    }

    function readCSVFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    resolve(XLSX.utils.sheet_to_json(sheet));
                } catch (err) { reject(err); }
            };
            reader.onerror = err => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    // ======================== 配置驅動的上傳區塊 ========================
    const sections = [
        {
            // 社群後臺
            type: 'social',
            fileInputId: 'socialFiles',
            uploadAreaId: 'socialUploadArea',
            fileListId: 'socialFileList',
            statusId: 'socialStatus',
            clearBtnId: 'clearSocialBtn',
            // 判斷檔案是否屬於此區塊（檔名濾鏡）
            isValidFile: (filename) => {
                const upper = filename.toUpperCase();
                return upper.includes('IG') || upper.includes('FB') || upper.includes('LINE') ||
                       upper.includes('YOUTUBE') || upper.includes('THREADS');
            },
            // 從檔名取得頻道（僅社群需要）
            getChannel: (filename) => {
                const upper = filename.toUpperCase();
                if (upper.includes('IG')) return 'IG';
                if (upper.includes('FB')) return 'FB';
                if (upper.includes('LINE')) return 'LINE';
                if (upper.includes('YOUTUBE')) return 'YouTube';
                if (upper.includes('THREADS')) return 'Threads';
                return null;
            },
            // 處理上傳的檔案陣列
            processFiles: async (files, statusDiv) => {
                for (let file of files) {
                    const channel = sections[0].getChannel(file.name);
                    if (!channel) {
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含 IG/FB/LINE/YouTube/Threads 關鍵字，已略過。</div>`;
                        continue;
                    }
                    try {
                        const jsonRows = await readCSVFile(file);
                        if (!jsonRows.length) throw new Error('CSV 無資料列');
                        console.log(`📄 檔案 ${file.name} 欄位:`, Object.keys(jsonRows[0]));
                        const posts = parseCSVtoPosts(jsonRows, channel);
                        if (posts.length === 0) {
                            const sample = jsonRows[0];
                            const hasDate = sample['發佈日期'] || sample['date'];
                            const hasPlatform = sample['發布管道'] || sample['platform'];
                            let reason = !hasDate ? '缺少「發佈日期」或「date」；' : (!hasPlatform ? '缺少「發布管道」或「platform」；' : '日期或平臺格式無法解析。');
                            throw new Error(`無法解析出有效貼文。${reason} 請看控制台。`);
                        }
                        const key = `posts_${channel}`;
                        let existing = JSON.parse(localStorage.getItem(key) || '[]');
                        existing = existing.concat(posts);
                        localStorage.setItem(key, JSON.stringify(existing));
                        statusDiv.innerHTML += `<div class="success">✅ ${file.name} → ${channel} (${posts.length} 筆)</div>`;
                    } catch (err) {
                        console.error(err);
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
                    }
                }
            },
            // 更新顯示列表
            updateDisplay: () => {
                const channels = ['IG', 'FB', 'LINE', 'YouTube', 'Threads'];
                let html = '', hasAny = false;
                channels.forEach(ch => {
                    const raw = localStorage.getItem(`posts_${ch}`);
                    if (raw) {
                        try {
                            const count = JSON.parse(raw).length;
                            html += `<div class="file-item">📁 ${ch} : ${count} 筆貼文</div>`;
                            hasAny = true;
                        } catch(e) {}
                    }
                });
                document.getElementById('socialFileList').innerHTML = hasAny ? html : '尚未上傳任何社群檔案';
            },
            // 清除資料
            clearData: () => {
                ['IG', 'FB', 'LINE', 'YouTube', 'Threads'].forEach(ch => localStorage.removeItem(`posts_${ch}`));
                sections[0].updateDisplay();
                const statusDiv = document.getElementById('socialStatus');
                statusDiv.innerHTML = '<div class="success">🗑️ 已清空所有社群資料</div>';
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        },
        {
            // 客群回饋
            type: 'feedback',
            fileInputId: 'feedbackFiles',
            uploadAreaId: 'feedbackUploadArea',
            fileListId: 'feedbackFileList',
            statusId: 'feedbackStatus',
            clearBtnId: 'clearFeedbackBtn',
            isValidFile: (filename) => /回饋表單/i.test(filename) || /feedback/i.test(filename),
            getChannel: null, // 回饋不需要頻道
            processFiles: async (files, statusDiv) => {
                for (let file of files) {
                    if (!sections[1].isValidFile(file.name)) {
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} : 檔名未包含「回饋表單」或「feedback」，已略過。</div>`;
                        continue;
                    }
                    try {
                        const rows = await readCSVFile(file);
                        if (!rows.length) throw new Error('CSV 無資料列');
                        let existing = JSON.parse(localStorage.getItem('feedbackData') || '[]');
                        existing = existing.concat(rows);
                        localStorage.setItem('feedbackData', JSON.stringify(existing));
                        statusDiv.innerHTML += `<div class="success">✅ ${file.name} (${rows.length} 筆)</div>`;
                    } catch (err) {
                        console.error(err);
                        statusDiv.innerHTML += `<div class="error">❌ ${file.name} 解析失敗: ${err.message}</div>`;
                    }
                }
            },
            updateDisplay: () => {
                const raw = localStorage.getItem('feedbackData');
                let count = 0;
                if (raw) {
                    try { count = JSON.parse(raw).length; } catch(e) {}
                }
                document.getElementById('feedbackFileList').innerHTML = count ? `📋 已上傳 ${count} 筆回饋記錄` : '尚未上傳任何回饋表單';
            },
            clearData: () => {
                localStorage.removeItem('feedbackData');
                sections[1].updateDisplay();
                const statusDiv = document.getElementById('feedbackStatus');
                statusDiv.innerHTML = '<div class="success">🗑️ 已清空回饋數據</div>';
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        }
    ];

    // ======================== 統一初始化所有區塊 ========================
    sections.forEach(section => {
        const fileInput = document.getElementById(section.fileInputId);
        const uploadArea = document.getElementById(section.uploadAreaId);
        const statusDiv = document.getElementById(section.statusId);
        const clearBtn = document.getElementById(section.clearBtnId);

        // 點擊上傳區觸發檔案選擇
        uploadArea.addEventListener('click', () => fileInput.click());
        // 選擇檔案後處理
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            section.processFiles(files, statusDiv);
            setTimeout(() => { statusDiv.innerHTML = ''; }, 8000);
        });
        // 清除按鈕
        clearBtn.addEventListener('click', () => section.clearData());

        // 拖曳上傳
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.background = '#f4fae9'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.background = ''; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const files = Array.from(e.dataTransfer.files);
            section.processFiles(files, statusDiv);
            fileInput.files = files; // 同步顯示
            setTimeout(() => { statusDiv.innerHTML = ''; }, 8000);
        });

        // 初始顯示
        section.updateDisplay();
    });
</script>
</body>
</html>
